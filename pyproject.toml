[project]
name = "spectro"
version = "2.0.0"
description = "Spectrograms and heuristic lossy-source analysis for audio files"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
keywords = ["audio", "spectrogram", "dsp", "flac", "transcode", "forensics"]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "soundfile",
    "pillow"
]

[project.urls]
Homepage = "https://github.com/DamienBlackwood/spectro"
Changelog = "https://github.com/DamienBlackwood/spectro/blob/main/CHANGELOG.md"

[project.scripts]
spectro = "spectro.cli:main"

[tool.setuptools]
packages = ["spectro", "spectro.commands"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
